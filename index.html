<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Features - SITE Quizmix</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo-div">
            <img src="images/logo.png" alt="SITE Quizmix Logo" id="logo">
        </div>

        <div class="navbar-div">
                <!--Change to dropdown-->
                <a href="about.html">
                    About SITE
                    <img src="images/dropdown.svg" alt="arrow" id="button-arrow">
                </a>
        </div>

        <div class="open-button">
            <button class="open-btn">Open Quizmix</button>
        </div>

    </header>

    <!-- From Bottom of Header to See all features -->
    <div class="content-one">
        <div class="hero-section">
            <p class="big-text"><i>Studying</i> just became <i><u>easier</u></i></p>
            <p class="small-text">Quizmix is finely curated by SITE to make sure all your materials
                are accessible in one place, so you can focus on what matters most: <i>learning</i>.
            </p>
                <div class="hero-buttons">
                    <img src="images/posa-one.png" alt="Cat" id="posa-one">
                    <button class="open-btn-1">Open Quizmix <img src="images/button-arrow.svg" alt="arrow" id="button-arrow"></button>
                    
                </div>
            <a href="#features" id="hero-feature">See all features</a>
        </div>

        <div class="right-section">
            <img src="images/hero-image.png" alt="Hero Image" id="hero-image">
        </div>

    </div>
 
    <div class="content-two" id="features">

    </div>
    <script src="js/index.js"></script>
</body>
</html>
